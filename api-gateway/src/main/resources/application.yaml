spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: payment-pipeline-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true


logging:
  level:
    org.springframework.cloud.gateway: DEBUG


